/**
 * Release minification.
 *
 * Keep disabled for now because MAGD AI contains a large native/JS surface
 * and the first goal is a stable installable release APK.
 */
def enableProguardInReleaseBuilds = false

/**
 * JSC fallback.
 * Hermes is enabled in android/gradle.properties.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Load release signing properties when available.
 *
 * GitHub Actions creates:
 *   android/key.properties
 *   android/my_keystore.jks
 *
 * The same format can also be used for local/Termux builds.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseStoreFile =
        keystoreProperties.getProperty("storeFile") ?:
        System.getenv("RELEASE_STORE_FILE")

def releaseStorePassword =
        keystoreProperties.getProperty("storePassword") ?:
        System.getenv("RELEASE_STORE_PASSWORD")

def releaseKeyAlias =
        keystoreProperties.getProperty("keyAlias") ?:
        System.getenv("RELEASE_KEY_ALIAS")

def releaseKeyPassword =
        keystoreProperties.getProperty("keyPassword") ?:
        System.getenv("RELEASE_KEY_PASSWORD")

def releaseSigningReady =
        releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.magd.ai"

    defaultConfig {
        applicationId "com.magd.ai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 143
        versionName "1.16.1"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            // Custom CMake file used to link the HardwareInfo JNI shim
            // into React Native's appmodules library.
            path file("src/main/jni/CMakeLists.txt")
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug

            buildConfigField "boolean", "USE_DEV_SUPPORT", "true"
        }

        release {
            /*
             * A real release build must use the configured release key.
             *
             * The Build-apk workflow sets REQUIRE_RELEASE_SIGNING=true.
             * Without that flag, local development can still configure the
             * release variant with debug signing if no release key exists.
             */
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            } else if (System.getenv("REQUIRE_RELEASE_SIGNING") == "true") {
                throw new GradleException(
                    "Release signing is required, but key.properties or release signing environment variables are missing."
                )
            } else {
                signingConfig signingConfigs.debug
                println "Warning: Release signing credentials not found; using debug keystore for local development."
            }

            minifyEnabled enableProguardInReleaseBuilds

            proguardFiles(
                getDefaultProguardFile("proguard-android.txt"),
                "proguard-rules.pro"
            )

            buildConfigField "boolean", "USE_DEV_SUPPORT", "false"
        }

        releaseE2e {
            /*
             * E2E release-like build:
             * - inherits the normal release configuration
             * - stays debuggable for adb run-as
             * - uses the debug key
             * - resolves dependencies from release variants
             */
            initWith release

            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ["release"]
        }
    }

    flavorDimensions "distribution"

    productFlavors {
        prod {
            dimension "distribution"
        }

        e2e {
            dimension "distribution"
            applicationIdSuffix ".e2e"
        }
    }

    /*
     * Only keep the meaningful MAGD AI variants:
     *
     * prodDebug
     * prodRelease
     * e2eDebug
     * e2eReleaseE2e
     *
     * Do not generate:
     * e2eRelease
     * prodReleaseE2e
     */
    variantFilter { variant ->
        def flavors = variant.flavors*.name
        def buildType = variant.buildType.name

        if (flavors.contains("e2e") && buildType == "release") {
            setIgnore(true)
        }

        if (flavors.contains("prod") && buildType == "releaseE2e") {
            setIgnore(true)
        }
    }
}

dependencies {
    // React Native
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:34.4.0")
    implementation "com.google.firebase:firebase-appcheck-playintegrity"
    implementation "com.google.firebase:firebase-appcheck-debug"

    // Room
    def room_version = "2.8.2"
    implementation("androidx.room:room-runtime:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    kapt("androidx.room:room-compiler:$room_version")

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.10.5"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.4"

    // Concurrent Futures
    implementation "androidx.concurrent:concurrent-futures-ktx:1.3.0"

    // AndroidX Core
    implementation "androidx.core:core-ktx:1.17.0"

    // Chrome Custom Tabs
    implementation "androidx.browser:browser:1.8.0"

    // Google Play Billing
    implementation "com.android.billingclient:billing:8.2.1"

    // Networking
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}

project.ext.vectoricons = [
